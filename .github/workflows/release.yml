name: Build & Publish KetikKu Release

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'scripts/**'
      - '.env.example'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ketikku-release-${{ github.ref }}
  cancel-in-progress: false

env:
  APP_SLUG: "ketikku"
  APP_DISPLAY_NAME: "KetikKu"

jobs:
  build-release:
    name: Build R8 arm64-v8a APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify offline-only policy
        run: python3 scripts/check_offline.py

      - name: Compute Automatic Version
        shell: bash
        run: |
          set -euo pipefail
          BASE_CODE=$(grep -E 'baseVersionCode\s*=' app/build.gradle.kts | head -n1 | sed -E 's/[^0-9]*([0-9]+).*/\1/')
          BASE_NAME=$(grep -E 'baseVersionName\s*=' app/build.gradle.kts | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')
          BASE_CODE="${BASE_CODE:-2}"
          BASE_NAME="${BASE_NAME:-1.1}"
          RUN_NUM="${GITHUB_RUN_NUMBER:-1}"

          ESCAPED_BASE=$(printf '%s' "$BASE_NAME" | sed 's/\./\\./g')
          MAX_TAG_NUM=$(git ls-remote --tags origin "refs/tags/v${BASE_NAME}.*" 2>/dev/null \
            | sed -nE "s|.*refs/tags/v${ESCAPED_BASE}\.([0-9]+)$|\1|p" \
            | sort -n \
            | tail -n 1 || true)
          MAX_TAG_NUM="${MAX_TAG_NUM:-0}"

          if [ "$RUN_NUM" -le "$MAX_TAG_NUM" ]; then
            NEXT_NUM=$((MAX_TAG_NUM + 1))
          else
            NEXT_NUM="$RUN_NUM"
          fi

          CI_VERSION_CODE=$((BASE_CODE + 10 + NEXT_NUM))
          CI_VERSION_NAME="${BASE_NAME}.${NEXT_NUM}"
          VERSION_TAG="v${CI_VERSION_NAME}"

          echo "CI_VERSION_CODE=${CI_VERSION_CODE}" >> "$GITHUB_ENV"
          echo "CI_VERSION_NAME=${CI_VERSION_NAME}" >> "$GITHUB_ENV"
          echo "VERSION_TAG=${VERSION_TAG}" >> "$GITHUB_ENV"
          echo "Automatic release version: ${VERSION_TAG} (versionCode=${CI_VERSION_CODE})"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        shell: bash
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER=$(find "$SDK_DIR/cmdline-tools" -name sdkmanager -type f 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $SDK_DIR/cmdline-tools" >&2
            exit 1
          fi
          (yes || true) | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "platforms;android-36.1" "build-tools;36.0.0"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Prepare keystores
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          umask 077
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              tr -d '[:space:]' < debug.keystore.base64 | base64 -d > debug.keystore
            else
              keytool -genkeypair \
                -keystore debug.keystore \
                -alias androiddebugkey \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -storepass android -keypass android \
                -dname "CN=Android Debug, O=Android, C=US" >/dev/null 2>&1
            fi
          fi

          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            if ! printf '%s' "$RELEASE_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/upload.jks"; then
              echo "::error::RELEASE_KEYSTORE_BASE64 is not valid base64. Re-copy the entire base64 string without missing or extra characters."
              exit 1
            fi
            JKS_SIZE=$(wc -c < "$RUNNER_TEMP/upload.jks")
            echo "Decoded release keystore size: ${JKS_SIZE} bytes"

            CLEAN_STORE_PASSWORD=$(printf '%s' "$STORE_PASSWORD" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
            CLEAN_KEY_PASSWORD=$(printf '%s' "${KEY_PASSWORD:-$CLEAN_STORE_PASSWORD}" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
            SRC_ALIAS=$(printf '%s' "${KEY_ALIAS:-}" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')

            if ! keytool -list -keystore "$RUNNER_TEMP/upload.jks" -storepass "$CLEAN_STORE_PASSWORD" >/dev/null 2>&1; then
              echo "::error::Failed to open keystore (size=${JKS_SIZE} bytes). Either STORE_PASSWORD is wrong/swapped with KEY_PASSWORD, or RELEASE_KEYSTORE_BASE64 is incomplete/from a different .jks file."
              exit 1
            fi

            if [ -z "$SRC_ALIAS" ]; then
              SRC_ALIAS=$(keytool -list -keystore "$RUNNER_TEMP/upload.jks" -storepass "$CLEAN_STORE_PASSWORD" 2>/dev/null | awk -F',' '/PrivateKeyEntry/{print $1; exit}' | xargs)
            fi
            if [ -n "$SRC_ALIAS" ] && [ "$SRC_ALIAS" != "upload" ]; then
              if ! keytool -changealias \
                -keystore "$RUNNER_TEMP/upload.jks" \
                -alias "$SRC_ALIAS" \
                -destalias upload \
                -storepass "$CLEAN_STORE_PASSWORD" \
                -keypass "$CLEAN_KEY_PASSWORD"; then
                echo "::error::Keystore opened, but failed to access alias '$SRC_ALIAS' with KEY_PASSWORD. Check KEY_ALIAS and KEY_PASSWORD secrets."
                exit 1
              fi
            fi
            echo "KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=$CLEAN_STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$CLEAN_KEY_PASSWORD" >> "$GITHUB_ENV"
          else
            PASS="ketikku-ci-release"
            keytool -genkeypair -v \
              -keystore "$RUNNER_TEMP/upload.jks" \
              -alias upload \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$PASS" -keypass "$PASS" \
              -dname "CN=${APP_DISPLAY_NAME} Release, OU=Android, O=${APP_DISPLAY_NAME}, L=Jakarta, ST=Jakarta, C=ID"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=$PASS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$PASS" >> "$GITHUB_ENV"
          fi

      - name: Cache Robolectric Android SDK JAR
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric/android-all-instrumented/16-robolectric-13921718-i7
          key: robolectric-sdk-16-13921718-i7

      - name: Pre-fetch Robolectric Android SDK JAR
        shell: bash
        run: |
          set -euo pipefail
          SDK_DIR="$HOME/.m2/repository/org/robolectric/android-all-instrumented/16-robolectric-13921718-i7"
          SDK_JAR="$SDK_DIR/android-all-instrumented-16-robolectric-13921718-i7.jar"
          if [ -s "$SDK_JAR" ]; then exit 0; fi
          mkdir -p "$SDK_DIR"
          TMP_JAR="${SDK_JAR}.tmp"
          PRIMARY_URL="https://maven-central.storage-download.googleapis.com/maven2/org/robolectric/android-all-instrumented/16-robolectric-13921718-i7/android-all-instrumented-16-robolectric-13921718-i7.jar"
          FALLBACK_URL="https://repo.maven.apache.org/maven2/org/robolectric/android-all-instrumented/16-robolectric-13921718-i7/android-all-instrumented-16-robolectric-13921718-i7.jar"
          if curl --fail --location --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors -o "$TMP_JAR" "$PRIMARY_URL"; then
            mv "$TMP_JAR" "$SDK_JAR"
          elif curl --fail --location --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors -o "$TMP_JAR" "$FALLBACK_URL"; then
            mv "$TMP_JAR" "$SDK_JAR"
          else
            rm -f "$TMP_JAR"
            exit 1
          fi

      - name: Run Unit & Robolectric Tests
        run: gradle :app:testDebugUnitTest --no-daemon --no-build-cache --stacktrace

      - name: Build R8 Minified arm64-v8a APK
        run: gradle :app:assembleRelease --no-daemon --no-build-cache --stacktrace

      - name: Verify APK Signature & Package Release Artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          APK_SRC="app/build/outputs/apk/release/app-release.apk"
          APK_VERSIONED="${APP_SLUG}-${VERSION_TAG}-arm64-v8a-release.apk"
          APK_LATEST="${APP_SLUG}-latest-arm64-v8a.apk"
          cp "$APK_SRC" "dist/$APK_VERSIONED"
          cp "$APK_SRC" "dist/$APK_LATEST"

          SDK_DIR="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          APKSIGNER=$(find "$SDK_DIR/build-tools" -name apksigner 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$APKSIGNER" ]; then
            echo "apksigner not found under $SDK_DIR/build-tools" >&2
            exit 1
          fi
          "$APKSIGNER" verify --print-certs "dist/$APK_VERSIONED" | tee dist/CERT_FINGERPRINT.txt
          (cd dist && sha256sum "$APK_VERSIONED" "$APK_LATEST") | tee dist/CHECKSUMS.txt

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_SLUG }}-release-apk
          path: dist/*
          retention-days: 7

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION_TAG }}
          name: ${{ env.APP_DISPLAY_NAME }} ${{ env.VERSION_TAG }}
          files: |
            dist/*.apk
            dist/CHECKSUMS.txt
            dist/CERT_FINGERPRINT.txt
          generate_release_notes: true

      - name: Clean Private Key & Temp Sync
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/upload.jks"
