name: Build & Publish KetikKu Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build R8 arm64-v8a APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Prepare release signing keystore
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            SRC_ALIAS="${KEY_ALIAS:-}"
            if [ -z "$SRC_ALIAS" ]; then
              SRC_ALIAS=$(keytool -list -keystore "$RUNNER_TEMP/upload.jks" -storepass "$STORE_PASSWORD" | awk -F',' '/PrivateKeyEntry/{print $1; exit}' | xargs)
            fi
            if [ -n "$SRC_ALIAS" ] && [ "$SRC_ALIAS" != "upload" ]; then
              keytool -changealias \
                -keystore "$RUNNER_TEMP/upload.jks" \
                -alias "$SRC_ALIAS" \
                -destalias upload \
                -storepass "$STORE_PASSWORD" \
                -keypass "$KEY_PASSWORD"
            fi
            echo "KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          else
            PASS="ketikku-ci-release"
            keytool -genkeypair -v \
              -keystore "$RUNNER_TEMP/upload.jks" \
              -alias upload \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$PASS" -keypass "$PASS" \
              -dname "CN=KetikKu Release, OU=Android, O=KetikKu, L=Jakarta, ST=Jakarta, C=ID"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=$PASS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$PASS" >> "$GITHUB_ENV"
          fi

      - name: Run Unit & Robolectric Tests
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Build R8 Minified arm64-v8a APK
        run: gradle :app:assembleRelease --no-daemon

      - name: Verify APK Signature & Package Release Artifacts
        shell: bash
        run: |
          mkdir -p dist
          if [[ "${GITHUB_REF_NAME:-}" == v* ]]; then
            VERSION_TAG="$GITHUB_REF_NAME"
          else
            VERSION_TAG="v$(grep -E 'versionName\s*=' app/build.gradle.kts | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')"
          fi
          APK_SRC="app/build/outputs/apk/release/app-release.apk"
          APK_OUT="dist/KetikKu-${VERSION_TAG}-arm64-v8a-release.apk"
          cp "$APK_SRC" "$APK_OUT"

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          "$APKSIGNER" verify --print-certs "$APK_OUT" | tee dist/CERT_FINGERPRINT.txt
          sha256sum "$APK_OUT" | tee dist/CHECKSUMS.txt

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ketikku-release-apk
          path: dist/*

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.apk
            dist/CHECKSUMS.txt
            dist/CERT_FINGERPRINT.txt
          generate_release_notes: true
